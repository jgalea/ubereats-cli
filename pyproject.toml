[project]
name = "ubereats-cli"
version = "0.1.0"
description = "Search Uber Eats, read menus, and order from the terminal"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jean Galea" }]
dependencies = [
    "curl-cffi>=0.13",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ubereats = "ubereats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ubereats"]

[tool.pytest.ini_options]
markers = ["network: hits ubereats.com, deselected by default"]
addopts = "-m 'not network'"
